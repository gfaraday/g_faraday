plugins {
    id 'com.android.library'
}

group 'com.yuxiaor.flutter.g_faraday'
version '1.0-SNAPSHOT'


rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.yuxiaor.flutter.g_faraday'
    compileSdk = 36
//    buildToolsVersion "29.0.3"
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // Flutter 3.44 (AGP 9) 内置 Kotlin 2.3.20，不再需要自带 KGP；
    // kotlinOptions 由 AGP 内置 Kotlin 提供。
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.activity:activity-ktx:1.6.0-alpha05"
}
